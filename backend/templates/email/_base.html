{% comment %}
Shared shell for transactional mail. Everything is inline-styled and table-based:
Gmail and Outlook strip <style> blocks and do not support flex or grid.
{% endcomment %}<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Hotel Express{% endblock %}</title>
  </head>
  <body style="margin:0;padding:0;background:#f2f4f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2430;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f2f4f7;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:14px;overflow:hidden;box-shadow:0 1px 3px rgba(20,25,40,0.08);">
            <tr>
              <td style="background:linear-gradient(135deg,#f19434,#d97c17);padding:22px 26px;">
                <span style="color:#ffffff;font-size:19px;font-weight:700;letter-spacing:-0.3px;">Hotel&nbsp;Express</span>
                <span style="color:rgba(255,255,255,0.85);font-size:13px;float:right;padding-top:5px;">{% block header_tag %}{% endblock %}</span>
              </td>
            </tr>
            <tr><td style="padding:26px;">{% block content %}{% endblock %}</td></tr>
            <tr>
              <td style="padding:16px 26px 22px;border-top:1px solid #e8ebf0;color:#7b8296;font-size:12px;line-height:1.6;">
                {% block footer %}Offline payment only — cash on delivery or at the hotel counter.{% endblock %}
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
